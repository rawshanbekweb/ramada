<!doctype html>
<html lang="uz"><head><meta charset="utf-8"><title>QR plitalar</title>
<style>
@page{size:A4;margin:10mm}
body{font-family:system-ui,sans-serif;margin:0}
.sheet{display:flex;flex-wrap:wrap;gap:6mm}
.plate{width:100mm;height:150mm;border:1px dashed #999;box-sizing:border-box;padding:8mm;display:flex;flex-direction:column;align-items:center;justify-content:space-between;page-break-inside:avoid}
.plate h1{margin:0;font-size:16pt;text-align:center}.plate .num{font-size:40pt;font-weight:800}
.plate svg{width:70mm;height:70mm}.plate p{margin:0;text-align:center;font-size:11pt}
.no-print{padding:10px}@media print{.no-print{display:none}}
</style></head>
<body>
<div class="no-print"><button onclick="print()">🖨 Chop etish</button> 10×15 sm akril plitalar uchun. Har bir QR imzolangan va faqat shu xonaga tegishli.</div>
<div class="sheet">
{% for it in items %}
<div class="plate">
  <h1>{{ hotel }}</h1>
  <div class="num">{{ it.room.number }}</div>
  {{ it.svg|safe }}
  <p><b>Wi-Fi va xizmatlar — QR'ni skanerlang</b><br>Wi-Fi · сервисы — сканируйте QR<br>Wi-Fi & services — scan the QR</p>
</div>
{% endfor %}
</div>
</body></html>
