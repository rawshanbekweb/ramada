name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,edge]"
      - run: pytest -W ignore::DeprecationWarning

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sq
          POSTGRES_PASSWORD: sq
          POSTGRES_DB: shaffof_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sq" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SQ_TEST_DATABASE_URL: postgresql+psycopg://sq:sq@localhost:5432/shaffof_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,edge]"
      - name: Migratsiyalar
        env:
          SQ_DATABASE_URL: postgresql+psycopg://sq:sq@localhost:5432/shaffof_test
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
      - run: pytest -W ignore::DeprecationWarning

  e2e:
    # Server + haqiqiy edge agent + virtual kameralar (MJPEG va soxta Hikvision)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,edge]"
      - run: python -W ignore -m tools.e2e_local
