name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,edge]"
      - run: pytest -W ignore::DeprecationWarning

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sq
          POSTGRES_PASSWORD: sq
          POSTGRES_DB: shaffof_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sq" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SQ_TEST_DATABASE_URL: postgresql+psycopg://sq:sq@localhost:5432/shaffof_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,edge]"
      - name: Migratsiyalar
        env:
          SQ_DATABASE_URL: postgresql+psycopg://sq:sq@localhost:5432/shaffof_test
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
      - run: pytest -W ignore::DeprecationWarning

  e2e:
    # Server + haqiqiy edge agent + virtual kameralar (MJPEG va soxta Hikvision)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,edge]"
      - run: python -W ignore -m tools.e2e_local

  docker:
    # Ishlab chiqarish image'i yig'iladimi va migratsiyalar bilan ishga tushadimi
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t shaffof:ci .
      - name: Konteynerni ishga tushirish
        run: |
          docker run -d --name sq -p 8000:8000 -e SQ_DATABASE_URL=sqlite:////srv/storage/ci.db shaffof:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/api/ping && break; sleep 2; done
          curl -sf http://127.0.0.1:8000/api/ping
          curl -sf -o /dev/null http://127.0.0.1:8000/panel/login
          docker exec sq python -m app.cli init --owner CI --login owner --password ci-pass-123
          docker exec sq python -m app.cli seed-demo
          docker logs sq | tail -20
