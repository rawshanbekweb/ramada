[project]
name = "shaffof-qabul"
version = "0.1.0"
description = "Shaffof qabul — mehmonni uch bosqichda tasdiqlash tizimi (Nukus)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.4",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "aiogram>=3.13",
  "apscheduler>=3.10,<4",
  "openpyxl>=3.1",
  "qrcode[pil]>=7.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "numpy>=1.26"]
# Mini-PC (edge agent): oddiy RTSP kameralar uchun video tahlil
edge = ["httpx>=0.27", "numpy>=1.26", "opencv-python-headless>=4.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "edge*"]

[tool.setuptools.package-data]
"app.web" = ["templates/**/*.html", "static/*"]
